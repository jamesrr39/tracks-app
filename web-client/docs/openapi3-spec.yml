openapi: 3.0.3
info:
  description: REST API definitions for Tracks App
  title: Tracks
  version: dev
servers:
- description: API server
  url: /api
paths:
  /v1/info:
    get:
      operationId: getServiceInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersInfoResponse'
          description: OK
      summary: Get service info
  /v1/tracks:
    get:
      operationId: getAllTrackSummaries
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersBuildGetAllSummariesResponse'
          description: OK
      summary: Get All Track Summaries
      tags:
      - Tracks
  /v1/tracks/{path}:
    get:
      operationId: getTrackSummaryByPath
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersBuildGetTrackSummaryResponse'
          description: OK
      summary: Get Track Summary by Path
      tags:
      - Tracks
  /v1/tracks/{path}/parsed/fit:
    get:
      operationId: getParsedFITTrack
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersBuildGetParsedFitFileResponse'
          description: OK
      summary: Get parsed FIT track
      tags:
      - Tracks
  /v1/tracks/{path}/parsed/gpx:
    get:
      operationId: getParsedGPXTrack
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersBuildGetParsedGpxFileResponse'
          description: OK
      summary: Get parsed GPX track
      tags:
      - Tracks
  /v1/tracks/{path}/raw:
    get:
      operationId: getRawFile
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Get raw file
      tags:
      - Tracks
  /v1/tracks/{path}/records:
    get:
      operationId: getTrackRecords
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttphandlersBuildGetTrackDetailResponse'
          description: OK
      summary: Get Track Records
      tags:
      - Tracks
components:
  schemas:
    DomainActivityBounds:
      properties:
        latMax:
          type: number
        latMin:
          type: number
        longMax:
          type: number
        longMin:
          type: number
      required:
      - latMin
      - latMax
      - longMin
      - longMax
      type: object
    DomainGeoFileSummary:
      properties:
        activityBounds:
          $ref: '#/components/schemas/DomainActivityBounds'
        activityType:
          type: string
        device:
          type: string
        endTime:
          format: date-time
          type: string
        geoFileType:
          enum:
          - FIT
          - GPX
          type: string
        hash:
          type: string
        name:
          type: string
        relativeFilePath:
          type: string
        startTime:
          format: date-time
          type: string
        totalDistance:
          type: number
      required:
      - name
      - relativeFilePath
      - geoFileType
      - hash
      - startTime
      - endTime
      - device
      - totalDistance
      - activityBounds
      - activityType
      type: object
    DomainRecord:
      properties:
        altitude:
          nullable: true
          type: number
        distance:
          type: integer
        heartRate:
          minimum: 0
          nullable: true
          type: integer
        posLat:
          type: number
        posLong:
          type: number
        power:
          minimum: 0
          nullable: true
          type: integer
        timestamp:
          format: date-time
          type: string
      required:
      - timestamp
      - posLat
      - posLong
      - distance
      - altitude
      - power
      type: object
    FitFile:
      type: object
    GpxGPX:
      type: object
    HttphandlersBuildGetAllSummariesResponse:
      properties:
        trackSummaries:
          items:
            $ref: '#/components/schemas/DomainGeoFileSummary'
          type: array
      required:
      - trackSummaries
      type: object
    HttphandlersBuildGetParsedFitFileResponse:
      properties:
        file:
          $ref: '#/components/schemas/FitFile'
      required:
      - file
      type: object
    HttphandlersBuildGetParsedGpxFileResponse:
      properties:
        file:
          $ref: '#/components/schemas/GpxGPX'
      required:
      - file
      type: object
    HttphandlersBuildGetTrackDetailResponse:
      properties:
        records:
          items:
            $ref: '#/components/schemas/DomainRecord'
          type: array
      required:
      - records
      type: object
    HttphandlersBuildGetTrackSummaryResponse:
      properties:
        trackSummary:
          $ref: '#/components/schemas/DomainGeoFileSummary'
      required:
      - trackSummary
      type: object
    HttphandlersInfoResponse:
      properties:
        mapOptions:
          properties:
            sources:
              items:
                $ref: '#/components/schemas/HttphandlersMapSourceType'
              type: array
          required:
          - sources
          type: object
      required:
      - mapOptions
      type: object
    HttphandlersMapSourceType:
      properties:
        name:
          type: string
        url:
          type: string
      type: object
